# Production overrides — internal services are never published (the host may
# have no firewall). The API stays on 127.0.0.1:8000 behind the system nginx.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Requires POSTGRES_PASSWORD in .env (interpolated into the database and the
# EKYC_DATABASE_URL of every app service).
services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports: !reset []

  redis:
    ports: !reset []

  api:
    environment:
      EKYC_DATABASE_URL: postgresql+psycopg2://ekyc:${POSTGRES_PASSWORD}@postgres:5432/ekyc
    restart: unless-stopped

  worker-cpu:
    environment:
      EKYC_DATABASE_URL: postgresql+psycopg2://ekyc:${POSTGRES_PASSWORD}@postgres:5432/ekyc
    restart: unless-stopped

  worker-gpu:
    # No GPU on this host: consumes the `gpu` queue with CPU execution
    # (EKYC_GPU_ENABLED auto-detection). On a GPU host add compose.gpu.yml.
    environment:
      EKYC_DATABASE_URL: postgresql+psycopg2://ekyc:${POSTGRES_PASSWORD}@postgres:5432/ekyc
    restart: unless-stopped
