[project]
name = "ittech-ekyc"
version = "0.1.0"
description = "IT-TECH eKYC - plateforme de confiance numerique (eKYC, e-signature, evidence)"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "SQLAlchemy==2.0.35",
    "alembic==1.13.3",
    "psycopg2-binary==2.9.10",
    "celery==5.4.0",
    "redis==5.0.8",
    "httpx==0.27.2",
    "PyJWT==2.9.0",
    "cryptography==43.0.1",
    "reportlab==4.2.2",
    "pypdf==5.0.1",
    "python-multipart==0.0.9",
    "Jinja2==3.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "ruff==0.6.8",
    "mypy==1.11.2",
]
ocr = [
    "pytesseract==0.3.13",
    "Pillow==10.4.0",
]
biometrics = [
    "opencv-python-headless==4.10.0.84",
    "numpy==2.1.2",
    "onnxruntime==1.29.0",
    "pytesseract==0.3.13",
    "Pillow==10.4.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = false
plugins = []

[[tool.mypy.overrides]]
module = ["reportlab.*", "pytesseract.*", "celery.*", "boto3.*", "botocore.*", "cv2.*", "numpy.*", "PIL.*", "onnxruntime.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
