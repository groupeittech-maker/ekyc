# nginx vhost — eKYC API on the dedicated VPS.
# SSL is appended by certbot: certbot --nginx -d ekyc.srv1992558.hstgr.cloud
server {
    listen 80;
    listen [::]:80;  # ACME/LE clients may reach the host over IPv6
    server_name ekyc.srv1992558.hstgr.cloud;

    # Document photos / videos: keep comfortably above the upload cap.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8300;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # camera-permission policy is already emitted by the app when needed
        proxy_read_timeout 120s;
    }
}
