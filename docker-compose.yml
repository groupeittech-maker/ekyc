services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ekyc
      POSTGRES_PASSWORD: ekyc
      POSTGRES_DB: ekyc
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ekyc"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ekyc
      MINIO_ROOT_PASSWORD: ekyc-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  # One-shot: create the archive bucket so the s3 backend works out of the box.
  createbuckets:
    image: minio/mc:RELEASE.2024-09-16T17-43-14Z
    depends_on:
      minio: {condition: service_started}
    entrypoint: >-
      sh -c "until mc alias set ekyc http://minio:9000 ekyc ekyc-secret; do sleep 2; done &&
             mc mb --ignore-existing ekyc/ekyc-archive &&
             echo 'bucket ready'"

  # One-shot: provision the in-house biometric ONNX models into the shared volume.
  # Runs only when the inhouse providers are enabled; safe to re-run (idempotent).
  models-init:
    build: .
    command: python -m scripts.fetch_models
    environment:
      EKYC_BIOMETRICS_MODEL_DIR: /srv/ekyc/var/models
    volumes: ["models:/srv/ekyc/var/models"]

  api:
    build: .
    command: >-
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      EKYC_DATABASE_URL: postgresql+psycopg2://ekyc:ekyc@postgres:5432/ekyc
      EKYC_REDIS_URL: redis://redis:6379/0
      EKYC_CELERY_ALWAYS_EAGER: "false"
      EKYC_STORAGE_ROOT: /srv/ekyc/var/storage
      EKYC_SIGNING_KEY_PATH: /srv/ekyc/var/keys/signing_key.pem
      EKYC_BIOMETRICS_MODEL_DIR: /srv/ekyc/var/models
    env_file: [.env]
    ports: ["8000:8000"]
    volumes: ["archive:/srv/ekyc/var", "models:/srv/ekyc/var/models"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}

  worker:
    build: .
    command: celery -A app.workers.celery_app:celery_app worker -Q ekyc,ocr,biometrics,webhooks -l info
    environment:
      EKYC_DATABASE_URL: postgresql+psycopg2://ekyc:ekyc@postgres:5432/ekyc
      EKYC_REDIS_URL: redis://redis:6379/0
      EKYC_CELERY_ALWAYS_EAGER: "false"
      EKYC_STORAGE_ROOT: /srv/ekyc/var/storage
      EKYC_SIGNING_KEY_PATH: /srv/ekyc/var/keys/signing_key.pem
      EKYC_BIOMETRICS_MODEL_DIR: /srv/ekyc/var/models
    env_file: [.env]
    volumes: ["archive:/srv/ekyc/var", "models:/srv/ekyc/var/models"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}

volumes:
  pgdata:
  miniodata:
  archive:
  models:
