services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ekyc
      POSTGRES_PASSWORD: ekyc
      POSTGRES_DB: ekyc
    # Bound to localhost: never expose the database on the public interface.
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ekyc"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]

  # Optional S3-compatible object store — only needed with
  # EKYC_STORAGE_BACKEND=s3 (requires boto3). Enable with `--profile s3`.
  # MinIO's own images were pulled from Docker Hub/quay in 2025; the frozen
  # bitnamilegacy build is used as a drop-in replacement.
  minio:
    image: bitnamilegacy/minio:latest
    profiles: ["s3"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ekyc
      MINIO_ROOT_PASSWORD: ekyc-secret
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 10

  # One-shot: create the archive bucket so the s3 backend works out of the box.
  createbuckets:
    image: bitnamilegacy/minio-client:latest
    profiles: ["s3"]
    depends_on:
      minio: {condition: service_started}
    entrypoint: >-
      sh -c "until mc alias set ekyc http://minio:9000 ekyc ekyc-secret; do sleep 2; done &&
             mc mb --ignore-existing ekyc/ekyc-archive &&
             echo 'bucket ready'"

  # One-shot: provision the in-house biometric ONNX models into the shared volume.
  # Runs only when the inhouse providers are enabled; safe to re-run (idempotent).
  models-init:
    build: .
    command: python -m scripts.fetch_models
    environment:
      EKYC_BIOMETRICS_MODEL_DIR: /srv/ekyc/var/models
    volumes: ["models:/srv/ekyc/var/models"]

  # One-shot: provision the anti-spoofing ONNX model (MiniFAS).
  antispoof-init:
    build: .
    command: python -m scripts.fetch_antispoof
    environment:
      EKYC_BIOMETRICS_MODEL_DIR: /srv/ekyc/var/models
    volumes: ["models:/srv/ekyc/var/models"]

  api:
    build: .
    command: >-
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      EKYC_DATABASE_URL: postgresql+psycopg2://ekyc:ekyc@postgres:5432/ekyc
      EKYC_REDIS_URL: redis://redis:6379/0
      EKYC_CELERY_ALWAYS_EAGER: "false"
      EKYC_STORAGE_ROOT: /srv/ekyc/var/storage
      EKYC_SIGNING_KEY_PATH: /srv/ekyc/var/keys/signing_key.pem
      EKYC_BIOMETRICS_MODEL_DIR: /srv/ekyc/var/models
    env_file: [.env]
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["archive:/srv/ekyc/var", "models:/srv/ekyc/var/models"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}

  # Pool CPU: hash, PDF, signature, OTP, webhooks. Scaler avec `--scale worker-cpu=N`.
  worker-cpu:
    build: .
    command: celery -A app.workers.celery_app:celery_app worker -Q cpu -l info
    environment:
      EKYC_DATABASE_URL: postgresql+psycopg2://ekyc:ekyc@postgres:5432/ekyc
      EKYC_REDIS_URL: redis://redis:6379/0
      EKYC_CELERY_ALWAYS_EAGER: "false"
      EKYC_STORAGE_ROOT: /srv/ekyc/var/storage
      EKYC_SIGNING_KEY_PATH: /srv/ekyc/var/keys/signing_key.pem
    env_file: [.env]
    volumes: ["archive:/srv/ekyc/var"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}

  # Pool GPU mutualise entre tenants: OCR, liveness, face matching.
  # Sur une machine GPU, ajouter `gpus: all` (ou une reservation NVIDIA) et pointer
  # EKYC_OCR_PROVIDER / EKYC_FACE_PROVIDER vers les modeles locaux.
  worker-gpu:
    build: .
    command: celery -A app.workers.celery_app:celery_app worker -Q gpu -l info --concurrency 2
    environment:
      EKYC_DATABASE_URL: postgresql+psycopg2://ekyc:ekyc@postgres:5432/ekyc
      EKYC_REDIS_URL: redis://redis:6379/0
      EKYC_CELERY_ALWAYS_EAGER: "false"
      EKYC_STORAGE_ROOT: /srv/ekyc/var/storage
      EKYC_SIGNING_KEY_PATH: /srv/ekyc/var/keys/signing_key.pem
      EKYC_BIOMETRICS_MODEL_DIR: /srv/ekyc/var/models
    env_file: [.env]
    volumes: ["archive:/srv/ekyc/var", "models:/srv/ekyc/var/models"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_started}

volumes:
  pgdata:
  miniodata:
  archive:
  models:
